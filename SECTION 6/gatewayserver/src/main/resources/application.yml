server:
  port: 8888

spring:
  application:
    name: gatewayserver

  cloud:
    config:
      enabled: false

    discovery:
      enabled: true

    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
              lower-case-service-id: true
          routes:
              - id: r1
                uri: lb://ETAT-MICROSERVICE
                predicates:
                  - Path=/api/etat/**
              - id: r2
                uri: lb://TELEPHONE-MICROSERVICE
                predicates:
                  - Path=/api/telephone/**


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    gateway:
      access: unrestricted